<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070807" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        let mode = "dark";
        try {
          const stored = localStorage.getItem("account-hub-theme:v1");
          if (["dark", "light", "system"].includes(stored)) mode = stored;
        } catch {}
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#070807" : "#f5f6f7");
      })();
    </script>
    <title>Account Hub</title>
    <script type="module" crossorigin src="/assets/index-Cw-k8zxR.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BQXbOpSX.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
